name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]  # Windows is the real target: it runs the ctypes pid probe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm test
      - name: install.ps1 parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      # The installer for real: a throwaway Hermes folder, the logon task, the service answering.
      - name: install.ps1 installs and uninstalls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP "hermes"
          New-Item -ItemType Directory -Force -Path "$h\profiles\scout" | Out-Null
          Set-Content "$h\profiles\scout\profile.yaml" "ui_meta:`n  hermes-bots:`n    title: Scout"
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -HermesHome $h -Port 8194
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path "$h\desktop-plugins\crew-monitor\plugin.js" -Pattern "const SERVICE_PORT = 8194" -Quiet)) { throw "port not set in installed plugin" }
          $crew = Invoke-RestMethod http://127.0.0.1:8194/crew
          if ($crew.bots[0].title -ne "Scout") { throw "service is not reading the test home" }
          if ($crew.control) { throw "control must be off by default" }
          # opt in: the panel copy and the service must end up with the same secret
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -HermesHome $h -Port 8194 -EnableControl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $token = (Get-Content "$env:LOCALAPPDATA\HermesCrewMonitor\control-token.txt" -Raw).Trim()
          if (-not (Select-String -Path "$h\desktop-plugins\crew-monitor\plugin.js" -SimpleMatch "const CONTROL_TOKEN = '$token'" -Quiet)) { throw "token not set in installed plugin" }
          if (-not (Invoke-RestMethod http://127.0.0.1:8194/health).control) { throw "control not on after -EnableControl" }
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Uninstall -HermesHome $h
          if (Test-Path "$h\desktop-plugins\crew-monitor") { throw "plugin not removed" }
          if (Get-ScheduledTask -TaskName HermesCrewMonitor -ErrorAction SilentlyContinue) { throw "task not removed" }
